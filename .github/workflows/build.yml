name: Build Apps

on:
  push:
    branches: [ "main" ]
  release:
    types: [ created ]

jobs:
  build-electron:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./client/electron-app
        run: npm install

      - name: Build Electron App & YAMLs
        working-directory: ./client/electron-app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-builds-${{ matrix.os }}
          path: client/electron-app/dist/**/*
          
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./client/cli-app
        run: npm install

      - name: Build CLI App
        working-directory: ./client/cli-app
        run: npm run build

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-builds
          path: client/cli-app/dist/**/*